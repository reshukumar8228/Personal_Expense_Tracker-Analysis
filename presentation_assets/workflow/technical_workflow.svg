<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D2B"/>
      <stop offset="100%" stop-color="#0D1238"/>
    </linearGradient>
    <linearGradient id="blueBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="16" fill="url(#bgGradTech)"/>

  <!-- Title -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">TECHNICAL EXECUTION FLOW &amp; RUNTIME PIPELINE</text>
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#879BFF">REQUEST ROUTING, SESSION MANAGEMENT, MODULE ORCHESTRATION, AND PERSISTENCE</text>
  </g>

  <!-- Flow Steps -->
  <!-- Col 1: Ingress & Auth -->
  <g transform="translate(60, 95)">
    <rect width="240" height="550" rx="12" fill="#151D4D" stroke="#34458A" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect width="240" height="40" rx="12" fill="url(#blueBox)"/>
    <rect y="25" width="240" height="15" fill="url(#blueBox)"/>
    <text x="16" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">1. INGRESS &amp; AUTH</text>

    <!-- Node 1 -->
    <rect x="15" y="55" width="210" height="70" rx="8" fill="#182254" stroke="#4169E1"/>
    <text x="25" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">HTTP / WebSocket Event</text>
    <text x="25" y="100" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">Browser loads app URL</text>
    <text x="25" y="115" font-family="system-ui, sans-serif" font-size="10.5" fill="#38BDF8">st.set_page_config()</text>

    <!-- Node 2 -->
    <rect x="15" y="145" width="210" height="95" rx="8" fill="#182254" stroke="#4169E1"/>
    <text x="25" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Session State Guard</text>
    <text x="25" y="190" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">Check st.session_state</text>
    <text x="25" y="208" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">if not authenticated:</text>
    <text x="25" y="226" font-family="system-ui, sans-serif" font-size="10.5" fill="#F59E0B">render_auth_page()</text>

    <!-- Node 3 -->
    <rect x="15" y="260" width="210" height="95" rx="8" fill="#182254" stroke="#4169E1"/>
    <text x="25" y="285" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Security Verification</text>
    <text x="25" y="305" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">PBKDF2 HMAC-SHA256</text>
    <text x="25" y="323" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">100,000 hash iterations</text>
    <text x="25" y="341" font-family="system-ui, sans-serif" font-size="10.5" fill="#10B981">Salt hex verification</text>

    <!-- Node 4 -->
    <rect x="15" y="375" width="210" height="150" rx="8" fill="#182254" stroke="#4169E1"/>
    <text x="25" y="400" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Context Initialization</text>
    <text x="25" y="420" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• Set st.session_state.user</text>
    <text x="25" y="438" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• Retrieve currency (INR/$)</text>
    <text x="25" y="456" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• Retrieve theme preference</text>
    <text x="25" y="474" font-family="system-ui, sans-serif" font-size="10.5" fill="#38BDF8">• inject_custom_css()</text>
    <text x="25" y="492" font-family="system-ui, sans-serif" font-size="10.5" fill="#38BDF8">• Render Sidebar &amp; Profile</text>
  </g>

  <!-- Arrow Col 1 -> Col 2 -->
  <path d="M 305 370 L 335 370" stroke="#879BFF" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="335,365 345,370 335,375" fill="#879BFF"/>

  <!-- Col 2: Business Logic & Processing -->
  <g transform="translate(350, 95)">
    <rect width="480" height="550" rx="12" fill="#151D4D" stroke="#34458A" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect width="480" height="40" rx="12" fill="url(#purpleBox)"/>
    <rect y="25" width="480" height="15" fill="url(#purpleBox)"/>
    <text x="16" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">2. MODULE DISPATCH &amp; BUSINESS LOGIC</text>

    <!-- 4 Sub-blocks -->
    <g transform="translate(15, 55)">
      <!-- Dashboard Engine -->
      <rect x="0" y="0" width="215" height="110" rx="8" fill="#182254" stroke="#8B3DCE"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Executive KPI Engine</text>
      <text x="14" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">Income, Expense, Net Surplus</text>
      <text x="14" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#38BDF8">Health Index (0-100 Score)</text>
      <text x="14" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">Savings Rate % formula</text>
      <text x="14" y="94" font-family="system-ui, sans-serif" font-size="10" fill="#F59E0B">Active budget alert banner</text>

      <!-- Transactions Manager -->
      <rect x="235" y="0" width="215" height="110" rx="8" fill="#182254" stroke="#8B3DCE"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Transaction Hub &amp; CRUD</text>
      <text x="14" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">Dynamic SQL Query generator</text>
      <text x="14" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#38BDF8">Single-row selection callback</text>
      <text x="14" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">Inline Edit / Delete modal</text>
      <text x="14" y="94" font-family="system-ui, sans-serif" font-size="10" fill="#10B981">Recurring subscription logic</text>

      <!-- ML Engine -->
      <rect x="0" y="125" width="215" height="110" rx="8" fill="#182254" stroke="#C52DDB" stroke-width="1.5"/>
      <text x="14" y="149" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E052F2">🤖 Scikit-Learn Engine</text>
      <text x="14" y="169" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">Time-series feature matrix</text>
      <text x="14" y="185" font-family="system-ui, sans-serif" font-size="10" fill="#38BDF8">Lag-1 &amp; 3-Month Rolling Avg</text>
      <text x="14" y="201" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">Linear &amp; RF Regression fit</text>
      <text x="14" y="219" font-family="system-ui, sans-serif" font-size="10" fill="#E052F2">95% Confidence Intervals</text>

      <!-- Smart Insights -->
      <rect x="235" y="125" width="215" height="110" rx="8" fill="#182254" stroke="#8B3DCE"/>
      <text x="14" y="149" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">🧠 Financial Intelligence</text>
      <text x="14" y="169" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">50/30/20 Rule compliance</text>
      <text x="14" y="185" font-family="system-ui, sans-serif" font-size="10" fill="#38BDF8">Anomaly spike detector</text>
      <text x="14" y="201" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">&gt;25% surge vs 3-month avg</text>
      <text x="14" y="219" font-family="system-ui, sans-serif" font-size="10" fill="#10B981">Tailored financial advice</text>

      <!-- Visual Analytics -->
      <rect x="0" y="250" width="215" height="110" rx="8" fill="#182254" stroke="#8B3DCE"/>
      <text x="14" y="274" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">📈 Plotly Visual Pipeline</text>
      <text x="14" y="294" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">Multi-tab chart generation</text>
      <text x="14" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#38BDF8">Cumulative cashflow line</text>
      <text x="14" y="326" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">Box plots for outlier detection</text>
      <text x="14" y="344" font-family="system-ui, sans-serif" font-size="10" fill="#879BFF">Day-of-Week spend heatmap</text>

      <!-- Import / Export -->
      <rect x="235" y="250" width="215" height="110" rx="8" fill="#182254" stroke="#8B3DCE"/>
      <text x="14" y="274" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">📥 Ingestion &amp; Reporting</text>
      <text x="14" y="294" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">Pandas &amp; OpenPyXL parsing</text>
      <text x="14" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#38BDF8">Schema &amp; date validation</text>
      <text x="14" y="326" font-family="system-ui, sans-serif" font-size="10" fill="#9AA8D1">FPDF2 PDF document engine</text>
      <text x="14" y="344" font-family="system-ui, sans-serif" font-size="10" fill="#10B981">Multi-page executive report</text>

      <!-- Budgets & Savings row -->
      <rect x="0" y="375" width="450" height="95" rx="8" fill="#182254" stroke="#8B3DCE"/>
      <text x="14" y="400" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">🎯 Budgets &amp; Savings Goals Orchestrator</text>
      <text x="14" y="420" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• Category caps upsert with ON CONFLICT DO UPDATE clause</text>
      <text x="14" y="438" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• Milestone progress tracking and target completion calculation</text>
      <text x="14" y="456" font-family="system-ui, sans-serif" font-size="10.5" fill="#38BDF8">• Interactive deposit logger popovers with real-time balance update</text>
    </g>
  </g>

  <!-- Arrow Col 2 -> Col 3 -->
  <path d="M 835 370 L 865 370" stroke="#879BFF" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="865,365 875,370 865,375" fill="#879BFF"/>

  <!-- Col 3: Storage & Persistence -->
  <g transform="translate(880, 95)">
    <rect width="260" height="550" rx="12" fill="#151D4D" stroke="#34458A" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect width="260" height="40" rx="12" fill="url(#greenBox)"/>
    <rect y="25" width="260" height="15" fill="url(#greenBox)"/>
    <text x="16" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">3. DUAL-PERSISTENCE</text>

    <!-- Node 1 -->
    <rect x="15" y="55" width="230" height="120" rx="8" fill="#182254" stroke="#10B981"/>
    <text x="25" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Dual-Engine Gateway</text>
    <text x="25" y="100" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">database/db.py</text>
    <text x="25" y="118" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">Evaluates DATABASE_URL</text>
    <text x="25" y="136" font-family="system-ui, sans-serif" font-size="10.5" fill="#38BDF8">Applies dialect wrappers</text>
    <text x="25" y="154" font-family="system-ui, sans-serif" font-size="10.5" fill="#10B981">Auto-fallback handler</text>

    <!-- Node 2 -->
    <rect x="15" y="195" width="230" height="145" rx="8" fill="#182254" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="25" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">⚡ Supabase PostgreSQL</text>
    <text x="25" y="240" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• Cloud Production DB</text>
    <text x="25" y="258" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• Transaction Pooler (6543)</text>
    <text x="25" y="276" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• PgCursorWrapper (? → %s)</text>
    <text x="25" y="294" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• RETURNING id injection</text>
    <text x="25" y="312" font-family="system-ui, sans-serif" font-size="10.5" fill="#10B981">• Managed backups</text>

    <!-- Node 3 -->
    <rect x="15" y="360" width="230" height="150" rx="8" fill="#182254" stroke="#10B981" stroke-width="1.5"/>
    <text x="25" y="385" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981">🛡️ Local SQLite 3</text>
    <text x="25" y="405" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• expense_tracker.db</text>
    <text x="25" y="423" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• PRAGMA journal_mode=WAL</text>
    <text x="25" y="441" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• Zero network latency</text>
    <text x="25" y="459" font-family="system-ui, sans-serif" font-size="10.5" fill="#9AA8D1">• Seamless offline use</text>
    <text x="25" y="477" font-family="system-ui, sans-serif" font-size="10.5" fill="#F59E0B">• 3,700+ records verified</text>
  </g>
</svg>
